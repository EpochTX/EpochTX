    <text x="39" y="101" fill="#A7B0C5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="22" font-weight="500">AI Agent · Developer Tools · Open Source</text>
    <text x="39" y="150" fill="#D8DEE9" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="18">Building useful things, one commit at a time.</text>
